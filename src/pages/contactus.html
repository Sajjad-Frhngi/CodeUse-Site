    * {

    }

    body {
      margin: 0;
      background: linear-gradient(270deg, #8ebccc, #2F80ED, #56CCF2);
      background-size: 600% 600%;
      animation: bgShift 15s ease infinite;
      min-height: 100vh;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes bgShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      background: rgba(255 255 255 / 0.15);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 0 30px rgba(0 0 0 / 0.1);
      text-align: center;
      border: 1px solid rgba(255 255 255 / 0.3);
      transition: transform 0.3s ease;
      margin-top: 40px;
    }

    .container:hover {
      transform: scale(1.03);
      box-shadow: 0 0 40px rgba(255 255 255 / 0.5);
    }

    h1 {
      margin-bottom: 16px;
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 2px 5px rgba(0 0 0 / 0.3);
    }

    p {
      font-size: 1rem;
      margin-bottom: 24px;
      color: #e0e7ff;
      text-shadow: 0 1px 4px rgba(0 0 0 / 0.2);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    a {
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 72px;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    a:hover {
      color: #0b63f1;
      transform: scale(1.15);
    }

    svg {
      width: 60px;
      height: 60px;
      margin-bottom: 8px;
      fill: currentColor;
      filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.2));
      transition: filter 0.3s ease;
    }

    a:hover svg {
      filter: drop-shadow(0 0 8px #79c0f6);
    }

    .label {
      font-size: 0.8rem;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0 0 0 / 0.3);
    }

    .home-btn {
      margin-top: 16px;
      background-color: #2F80ED;
      color: white;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 128, 255, 0.4);
      transition: all 0.3s ease;
    }

    .home-btn:hover {
      background-color: #155db8;
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 102, 204, 0.6);
    }

    footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #e6ecf3;
